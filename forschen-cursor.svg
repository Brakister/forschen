<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3d42"/>
      <stop offset="45%" stop-color="#16171a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a8f97"/>
      <stop offset="100%" stop-color="#3a3d42"/>
    </linearGradient>
    <filter id="dropshadow" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- machined arrow blade, tip = hotspot at 1,1 -->
  <g filter="url(#dropshadow)">
    <path d="M1.5 1 L1.5 26 L8.5 20.2 L13 29.5 L17.3 27.4 L12.8 18.1 L21.5 17.4 Z"
          fill="url(#blade)" stroke="url(#edge)" stroke-width="1" stroke-linejoin="round"/>

    <!-- bevel highlight along the leading spine -->
    <path d="M2.3 2.6 L2.3 22.5 L8.1 18.1" fill="none" stroke="#9aa0a8" stroke-width="0.6" stroke-linecap="round" opacity="0.55"/>

    <!-- precision crosshair accent, tip-referenced -->
    <g stroke="#c9a04a" stroke-width="0.7" opacity="0.9">
      <line x1="4.5" y1="1" x2="4.5" y2="3.6"/>
      <line x1="1.5" y1="3.4" x2="4.1" y2="3.4" transform="rotate(0)"/>
    </g>
    <circle cx="1.5" cy="1" r="1.15" fill="#c9a04a"/>
  </g>
</svg>
